# aos-kernel — kernel configuration.
#
# This file holds NO secrets. Credentials are referenced by environment
# variable name (control.tokenEnv, mcp.servers.*.tokenEnv,
# egress.bindings.*.envVar) or by vault id in providers.yaml; a key whose name
# looks like a secret is refused at parse and the path is named. See
# src/config.ts.
#
# control.host is a literal in the schema: there is no spelling of this file
# that binds the control plane to a public interface (invariant 1).
version: 1

# Inside the program folder (operator decision, 2026-10), relative to the repo
# root. Parse admits a path inside the repo only under .aos/, and only while
# .gitignore ignores /.aos/, so the log is never committed. WARNING: `git clean
# -fdx`, or deleting this folder, deletes the event log and its anchor with it.
# Any absolute path outside the repo (e.g. ~/.aos) also works; $HOME itself, or
# a directory containing the repo or $HOME, is refused.
dataDir: ./.aos

control:
  host: 127.0.0.1
  port: 7777
  tokenEnv: AOS_CONTROL_TOKEN
  # Empty until the Tauri prototype exists (Phase 3). An Origin header, if
  # present, must still be loopback; this list is the additional allowance.
  allowedOrigins: []
  maxPayloadBytes: 1048576

events:
  anchorEvery: 100

mcp:
  servers:
    pmmcp:
      # Streamable HTTP on loopback. 8765 is the pmmcp dashboard; 8766 is the
      # MCP endpoint. The kernel is pmmcp's client aos-kernel and sends the
      # bearer named here, from the shell or <repo>/.env, where
      # `npm run aos-install` generates it and gives pmmcp only its sha256
      # digest (~/.persistent-memory-mcp/http_auth.yaml, read at server start).
      # pmmcp's gate runs in warn mode, so a missing or unknown token is logged
      # and still served; the kernel refuses to dial while this name is unset
      # rather than guess. Never a PMMCP_ name (config refuses one, D34): that
      # prefix is pmmcp's own, which its load_config reads as settings from a
      # shell that exports one, and a checkout up to 53ea308 refuses to start
      # under one that is no setting.
      url: http://127.0.0.1:8766/mcp
      tokenEnv: AOS_PMMCP_TOKEN
      # pmmcp sessions idle-expire, so the hub heartbeats inside that window.
      heartbeatMs: 240000
      requestTimeoutMs: 30000
      pingTimeoutMs: 10000
      listToolsTimeoutMs: 15000

secrets:
  # env: each provider entry's auth.envVar, from the env the kernel boots with:
  # a shell export that is not blank, else the operator's <repo>/.env, which the entry
  # point reads through --dotenv (npm run dev passes it; the kernel and broker
  # never open a file). pmmcp's get_secret returns only a masked sentence, by
  # design, so `vault` cannot supply a key; it stays in the code, dormant.
  source: env
  # Used only by source: vault. Confirmed against the live get_secret schema
  # (2026-09-21): the argument is `label`, not `key`.
  keyArg: label
  # Only meaningful with source: vault (parse refuses it otherwise).
  envFallback: false

sandbox:
  driver: docker
  # The worker image's name: the tag the image build script (egress plan I1,
  # scripts/build-worker-image.sh) gives what it builds, so `docker images`
  # shows which image is the kernel's. A name only: no run executes it,
  # because a tag is whatever image was last given it on that VM and a name
  # the VM lacks would be pulled.
  image: aos-worker:0.0.1
  # What every run executes: the image id that script prints (as `docker image
  # inspect --format {{.Id}}` does, sha256:<64 lower-case hex>), run by id with
  # --pull=never on both VMs. None ships, because the image is built on the
  # operator's VMs: while it is unset the sandbox subsystem is degraded, naming
  # this key, no run is built and nothing is pulled. Set it once the script
  # has built the image and loaded it on both VMs:
  # imageId: sha256:<64 hex>
  domains:
    trusted:
      # Colima keeps its sockets under $HOME; the ~ is expanded at parse,
      # because DOCKER_HOST reaches the docker CLI without a shell.
      dockerHost: unix://~/.colima/trusted/docker.sock
      network: aos-trusted
      mountRoot: ./.aos/workspaces/trusted
    hostile:
      dockerHost: unix://~/.colima/hostile/docker.sock
      network: aos-hostile
      mountRoot: ./.aos/workspaces/hostile
  defaults:
    user: 65534:65534
    pidsLimit: 256
    memory: 2g
    cpus: 2
    # One container's hard wallclock, at most: sandbox.exec gives a container
    # what is left of its run's budget, never more than this. A timer's delay,
    # so at most 2147483647 (about 24.8 days).
    wallclockMs: 600000

# What the kernel's egress engine may do for a sandboxed run (egress plan,
# Phase 2). Only the .env loader reads this yet (a binding's envVar is a name
# it accepts); egress itself is a stub that refuses until the wiring task
# (W1), whatever this says. It ships disabled with no binding, because any
# binding widens what a run can reach. Every key is strict: a typo is refused
# at parse, not taken for a setting. Egress serves the trusted domain alone,
# so there is no domain key: the hostile domain gets no channel and no egress.
egress:
  enabled: false
  # Where the in-image mux listens, inside the container's own network
  # namespace (--network none): the port the worker image's proxy settings
  # name and its mux binds. Parse admits no other.
  muxPort: 3128
  # Per grant (one container's channel). A grant past any of these is revoked.
  # The three that size what the kernel holds for a container are bounded:
  # frameMaxBytes at most 1 MiB, maxFlows at most 256, maxHeaderBytes at most
  # 64 KiB. idleMs is a timer's delay: at most 2147483647 (about 24.8 days).
  limits:
    frameMaxBytes: 65536
    maxFlows: 16
    maxHeaderBytes: 16384
    maxRequests: 2000
    maxBytes: 536870912
    maxDenied: 20
    idleMs: 60000
  # A binding is a credential for one host, named by the .env name its value
  # is read from (never a value; the vault is dormant), with the profiles it
  # serves (git-fetch, git-push, github-pulls) and the repositories it may be
  # used on. Its envVar joins the names the .env loader accepts; the operator
  # adds the value, and the installer never generates one. Never a PMMCP_ name
  # (pmmcp's own prefix, D34), and never control.tokenEnv or an MCP server's
  # tokenEnv. A provider's key will be refused at boot once the wiring task
  # (W1) lands; until then no request uses a binding. Its id, host and
  # repositories must be names the event log would record as they are, not
  # censored as a credential shape. Pushes and pull requests land under
  # refs/heads/aos/<runId>/ only. A shape, for when the operator adds one:
  #   bindings:
  #     github-git:
  #       host: github.com
  #       scheme: Basic   # user x-access-token unless basicUser names another
  #       envVar: AOS_GITHUB_TOKEN
  #       profiles: [git-fetch]
  #       repos: [owner/fixture]
  bindings: {}

# pmmcp goal tools. Every name and argument here matches the operator's live
# capture of 2026-10-18 (test/fixtures/pmmcp-listtools.json), and every call goes
# through the typed wrappers in src/goals/pmmcp.ts. The reply texts are still
# read from pmmcp's source: a listTools capture shows arguments and
# descriptions, never replies.
#
# Config rather than constants, so a pmmcp upgrade that renames something is one
# line of YAML instead of a patch. At boot the kernel compares these names, the
# arguments the server requires and the types it accepts against what the
# connected server declares; a disagreement appends `goals.degraded` naming it
# and disables goal writing, so nothing guesses at a call the server would
# reject. `npm run capture:pmmcp` re-reads the live schemas.
goals:
  # Write the tree from a plan found in a finished orchestrator run. Confined to
  # that agent's own memory namespace, and every write is logged as `plan.adopted`
  # plus one `goal.created` per goal. Set false to watch the CEO before it writes
  # anything durable.
  adoptFromRuns: true
  # Confirmed by the live capture. update_goal and get_goal_tree take no
  # project_id, so the kernel checks a goal's namespace against its own
  # goal.created record before moving it.
  tools:
    create: create_goal
    updateStatus: update_goal
    get: get_goal_tree
    list: list_goals
  args:
    projectId: project_id
    goalId: goal_id
    parentId: parent_goal_id
    kind: goal_type
    title: title
    status: status
    progress: progress_pct
  # pmmcp has no `review`: it is sent as in_progress (with progress 100) and
  # stays `review` in the kernel's log. The kernel never sends `completed`;
  # closing a goal is the operator's decision, made in pmmcp.
  statuses:
    in_progress: in_progress
    blocked: blocked
    review: in_progress

lanes:
  main: 4
  subagent: 8

# D30. A manifest may only LOWER these; none of them admits "unlimited".
budgets:
  defaultRunMicroUsd: 2000000
  defaultWallclockMs: 600000
  maxRetries: 2
  maxLlmCallsPerRun: 50
  maxToolCallsPerRun: 100
  approvalWaitMs: 300000
