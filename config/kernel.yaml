# aos-kernel — kernel configuration.
#
# This file holds NO secrets. Credentials are referenced by environment
# variable name (control.tokenEnv, mcp.servers.*.tokenEnv) or by vault id in
# providers.yaml; a key whose name looks like a secret is refused at parse and
# the path is named. See src/config.ts.
#
# control.host is a literal in the schema: there is no spelling of this file
# that binds the control plane to a public interface (invariant 1).
version: 1

# Outside the repository and never $HOME itself — both refused at parse. The
# event log must not live where repository tooling can reach it.
dataDir: ~/.aos

control:
  host: 127.0.0.1
  port: 7777
  tokenEnv: AOS_CONTROL_TOKEN
  # Empty until the Tauri prototype exists (Phase 3). An Origin header, if
  # present, must still be loopback; this list is the additional allowance.
  allowedOrigins: []
  maxPayloadBytes: 1048576

events:
  anchorEvery: 100

mcp:
  servers:
    pmmcp:
      # Streamable HTTP on loopback. 8765 is the pmmcp dashboard; 8766 is the
      # MCP endpoint. No tokenEnv: pmmcp authenticates nobody and trusts
      # loopback (its RFC 9728 metadata lists no authorization servers), so any
      # local process can call it. Declare a tokenEnv only if it grows a bearer.
      url: http://127.0.0.1:8766/mcp
      # pmmcp sessions idle-expire, so the hub heartbeats inside that window.
      heartbeatMs: 240000
      requestTimeoutMs: 30000
      pingTimeoutMs: 10000
      listToolsTimeoutMs: 15000

secrets:
  # env: each provider entry's auth.envVar, read once at boot. Export it from a
  # prompt (`read -rs ANTHROPIC_API_KEY && export ANTHROPIC_API_KEY`), never
  # from a file. pmmcp's get_secret returns only a masked sentence, by design,
  # so `vault` cannot supply a key; it stays in the code, dormant.
  source: env
  # Used only by source: vault. Confirmed against the live get_secret schema
  # (2026-09-21): the argument is `label`, not `key`.
  keyArg: label
  # Only meaningful with source: vault (parse refuses it otherwise).
  envFallback: false

sandbox:
  driver: docker
  image: aos-worker:0.0.1
  domains:
    trusted:
      # Colima keeps its sockets under $HOME; the ~ is expanded at parse,
      # because DOCKER_HOST reaches the docker CLI without a shell.
      dockerHost: unix://~/.colima/trusted/docker.sock
      network: aos-trusted
      mountRoot: ~/.aos/workspaces/trusted
    hostile:
      dockerHost: unix://~/.colima/hostile/docker.sock
      network: aos-hostile
      mountRoot: ~/.aos/workspaces/hostile
  defaults:
    user: 65534:65534
    pidsLimit: 256
    memory: 2g
    cpus: 2
    wallclockMs: 600000

# pmmcp goal tools. EVERY NAME AND ARGUMENT HERE IS MODELLED, NOT CONFIRMED —
# nobody has read pmmcp's live `listTools` on this machine, and CLAUDE.md's Phase
# 1 says the typed wrappers come from those schemas.
#
# They are config rather than constants for exactly that reason: a wrong guess is
# one line of YAML instead of a patch. At boot the kernel asks the hub what the
# server declares and compares; a disagreement appends `goals.degraded` naming the
# tool or argument and disables goal writing, so nothing guesses at a call the
# server would reject. `npm run capture:pmmcp` turns the guesses into facts.
goals:
  # Write the tree from a plan found in a finished orchestrator run. Confined to
  # that agent's own memory namespace, and every write is logged as `plan.adopted`
  # plus one `goal.created` per goal. Set false to watch the CEO before it writes
  # anything durable.
  adoptFromRuns: true
  # Read from pmmcp's source (src/tools/goals.py @55f3c1a); the boot check and
  # `npm run capture:pmmcp` confirm them against the live server. update_goal
  # and get_goal_tree take no project_id, so the kernel checks a goal's
  # namespace against its own goal.created record before moving it.
  tools:
    create: create_goal
    updateStatus: update_goal
    get: get_goal_tree
    list: list_goals
  args:
    projectId: project_id
    goalId: goal_id
    parentId: parent_goal_id
    kind: goal_type
    title: title
    status: status
    progress: progress_pct
  # pmmcp has no `review`: it is sent as in_progress (with progress 100) and
  # stays `review` in the kernel's log. The kernel never sends `completed`;
  # closing a goal is the operator's decision, made in pmmcp.
  statuses:
    in_progress: in_progress
    blocked: blocked
    review: in_progress

lanes:
  main: 4
  subagent: 8

# D30. A manifest may only LOWER these; none of them admits "unlimited".
budgets:
  defaultRunMicroUsd: 2000000
  defaultWallclockMs: 600000
  maxRetries: 2
  maxLlmCallsPerRun: 50
  maxToolCallsPerRun: 100
  approvalWaitMs: 300000
