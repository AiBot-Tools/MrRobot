# researcher — a standard read-only worker.
#
# Versioned: every change bumps `version` and the prior file is frozen under
# history/. Read-only to agents (invariant 8).
#
# WHY THIS IS NOT THE WRITER WITH A DIFFERENT SOUL. The fleet design's first rule
# is that an agent earns its manifest through a distinct tool surface, taint
# posture, model binding, context boundary or gate posture — otherwise it is a
# template or a tool view wearing a persona. This one differs from `writer` on two
# of those, and both are enforced by code rather than by prose:
#
#   GATE POSTURE. tier 1 means read-only. The gate refuses a `write` or
#   `irreversible` tool to this agent whatever its soul says, and the registry now
#   refuses a manifest that lists one at load.
#
#   CONTEXT BOUNDARY. `aos/agent/researcher` is its own memory namespace. pmmcp
#   namespaces by project_id, so what this agent remembers is not what the writer
#   reads, and neither can reach `aos/ceo`.
id: researcher
version: 1
kind: standard
role: worker
soul: researcher.md

# T1: read-only MCP tools. Not 0, because reading is the whole job and tier 0
# means no tools at all; not 2, because nothing this agent does should be able to
# change anything.
tier: 1

model:
  primary: anthropic/claude-sonnet-5
  # Empty on purpose. Every other entry in providers.yaml is a placeholder the
  # router refuses to serve (D28), so a chain naming one could not run.
  fallbacks: []

tools:
  servers: [pmmcp]
  # Empty, and honestly so: tool-views.yaml exposes NOTHING to agents, and the
  # registry refuses a manifest that names a tool the views withhold. This is the
  # line that fills in first once the operator classifies pmmcp's read tools from
  # the `hub.tools.classified` event — `recall` and `search` are the two this
  # agent exists to use. Each such change is an ask-before.
  allow: []

egress:
  # Empty until the Phase 2 proxy exists. A researcher that cannot reach the
  # network is a researcher that can only read memory, which is the honest state
  # of this agent today rather than a hostname list nothing enforces.
  allow: []

# Lower than the kernel's per-run ceilings (D30), never higher — the registry
# refuses a manifest that asks for more. Sized for the shape of the work: several
# reads and a synthesis, not a long agentic loop.
budget:
  maxCostMicroUsd: 500000
  maxLlmCalls: 12
  maxToolCalls: 40
  maxWallclockMs: 300000

# No `sandbox:` block. Phase 1 runs the loop in process — the driver is probed and
# reported, never used by a run — so declaring a domain would claim an isolation
# that does not happen.
#
# No `schedule:` either, and that is deliberate: the only routable model is a
# frontier one, and an unattended run that can reach a frontier model is an
# unattended run that can empty a monthly envelope.

memory:
  projectId: aos/agent/researcher
