# Per-tool exposure policy (invariant 7).
#
# The default is the safe answer and the exception is what gets written down.
# `default: kernel-only` is a literal in the schema, so a tool nobody has
# classified is unreachable by agents rather than quietly available — which is
# what matters on a server that gains tools between releases.
#
# pmmcp registers 64 tools (the operator's capture, re-taken 2026-10-19). This file
# classifies NINETEEN of them, and every one is pinned CLOSED. Nothing is
# exposed to agents. The rest are not invented here: they resolve to
# kernel-only by the literal default, and the hub emits `hub.tools.classified`
# at connect listing them so the operator can classify them from what the
# server actually reports.
#
# Before exposing `recall` or `remember`: in pmmcp both take an OPTIONAL
# project_id, and leaving it out means GLOBAL scope (src/tools/primary.py). The
# namespaceArg pin below must therefore always SET project_id, never merely
# check one the model chose to send.
#
# Exposing a pmmcp tool to agents also needs a `namespaceArg`: the argument that
# names a memory namespace, which the gate then pins to the calling agent's own
# `memory.projectId` (or `none`, written out, for a tool that takes no
# namespace). The file is REFUSED without it. pmmcp namespaces by project_id and
# the model chooses that argument, so without the pin an exposed `recall` would
# read `aos/ceo` or any other agent's memory on request.
#
# Changing any tool's `exposure` is an ask-before under CLAUDE.md change
# control. The two forced sets below are not merely defaults: a file that tries
# to widen either is REFUSED at parse, which is what makes that rule
# enforceable instead of advisory.
version: 1

servers:
  pmmcp:
    default: kernel-only
    tools:
      # Forced kernel-only. Exposing any of these to an agent hands out
      # credentials or administrative reach directly, defeating invariant 2.
      # Listed explicitly rather than left to injection so an audit of this
      # file shows the decision instead of relying on code to imply it.
      get_secret:
        exposure: kernel-only
        risk: read
        note: vault read; the broker is the only caller
      set_secret:
        exposure: kernel-only
        risk: write
        note: vault write; the broker is the only caller
      audit_secrets:
        exposure: kernel-only
        risk: read
        note: vault audit log
      admin:
        exposure: kernel-only
        risk: irreversible
        note: administrative surface
      restore_backup:
        exposure: kernel-only
        risk: irreversible
        note: overwrites memory wholesale
      delete_context_source:
        exposure: kernel-only
        risk: irreversible
        note: destroys indexed context
      index_project:
        exposure: kernel-only
        risk: write
        note: rewrites the project index

      # Pinned kernel-only explicitly (operator decision, 2026-10). Each is
      # already kernel-only by default; writing it down makes the decision
      # auditable and survives a future default change. Read from pmmcp's
      # source (55f3c1a).
      forget:
        exposure: kernel-only
        risk: irreversible
        note: deletes a memory by key; project_id optional, so global by default
      delete_secret:
        exposure: kernel-only
        risk: irreversible
        note: vault delete
      list_secrets:
        exposure: kernel-only
        risk: read
        note: vault metadata (labels, no values)
      set_secret_expiry:
        exposure: kernel-only
        risk: write
        note: vault entry expiry
      get_audit_logs:
        exposure: kernel-only
        risk: read
        note: vault access audit
      save_secret_template:
        exposure: kernel-only
        risk: write
        note: vault template write
      get_secret_template:
        exposure: kernel-only
        risk: read
        note: vault template read
      repair_and_heal:
        exposure: kernel-only
        risk: irreversible
        note: rewrites pmmcp's own stores
      index_git_history:
        exposure: kernel-only
        risk: write
        note: indexes a repository's history into memory
      scrape_context:
        exposure: kernel-only
        risk: irreversible
        note: makes pmmcp fetch URLs itself, an egress path around the Phase 2 proxy

      # Forced disabled: nobody may call these, the kernel included. They make
      # nested model calls inside pmmcp, which would bypass the router,
      # budgets, taint and the event log wholesale — an agent could spend money
      # and act with none of it in the record.
      coding_agent:
        exposure: disabled
        risk: irreversible
        note: nested LLM calls bypass router, budgets, taint and the log
      session_insight_agent:
        exposure: disabled
        risk: read
        note: nested LLM calls bypass router, budgets, taint and the log

  # Kernel-native tools. Not an MCP server: the kernel implements these itself,
  # and they run through the same gate, the same re-check at execution and the
  # same tool.call / tool.result logging as any MCP tool. `write`, so a TAINTED
  # orchestrator needs a human to adopt a plan or delegate (invariant 3). The
  # registry refuses them in any manifest that is not role: orchestrator.
  kernel:
    default: kernel-only
    tools:
      adopt_plan:
        exposure: agent
        risk: write
        note: validates a ProposedPlan and writes the goal tree into the caller's own namespace
      delegate:
        exposure: agent
        risk: write
        note: runs one task of the adopted plan on the worker it names; spend charged to the caller

  # Kernel-native sandbox tools (egress plan S3; the operator accepted this
  # server on 2026-11-09). Not an MCP server either: the kernel runs exec
  # itself (src/runtime/sandbox-tools.ts), one container per call, in the
  # caller's own sandbox domain with no network (its one way out, for a
  # trusted run whose manifest names egress, is the kernel's egress engine
  # over its channel, under a grant issued before it starts), through the
  # same gate and the same tool.call / tool.result logging, with
  # sandbox.started and sandbox.killed between them. `write`, and it TAINTS the
  # run: what a container prints is attacker-influenced, so every exec after
  # the first in a run, and every other write, waits for a human (invariant 3).
  # The registry refuses it in any manifest that is not a worker with a
  # sandbox: block at tier 2 or more. The daemon wires it in (egress plan W1a,
  # and its egress W1), and no shipped manifest lists it.
  sandbox:
    default: kernel-only
    tools:
      exec:
        exposure: agent
        risk: write
        taints: true
        note: runs one command in a container of the caller's sandbox domain, with no network; taints the run
      # sandbox.publish (egress plan S4; the operator accepted its exposure and
      # risk on 2026-11-09): pushes the workspace's HEAD to
      # refs/heads/aos/<runId>/<branch> of the one bound repository the
      # caller's manifest may publish to and opens a pull request from it, by
      # the image's fixed /opt/aos/publish.mjs, never a command of the
      # caller's. `irreversible`, so a human approves every call (invariant 3),
      # seeing its branch, title and body whole, and only such a call's grant
      # holds git-push and github-pulls. The registry admits it only at tier 3.
      publish:
        exposure: agent
        risk: irreversible
        note: pushes the run's branch to its one bound repository and opens a pull request; a human approves every call
